# The main case from 2026-10-17 (FINDINGS_why_hard.md). The stage-sized plant
# (configs/ndpr_plant_sized.toml: same stages, 130 L mixers, the design's flows as the starting
# point), run with margin and an acidity floor:
#   - the controller aims at 99.8 % purity and 97 % recovery instead of the design's 99.5 % / 95 %
#     (notebook 26: operating with margin triples the window against the spec for ~15 % reagent).
#     The spec stays 99 % purity; off-spec product is counted against it.
#   - the controller keeps every extraction stage at or above 1e-3 mol/L of acid (decision 33;
#     without it the MPC over-saponified into a region the chemistry model can't represent).
# Level loops under the MPC are chosen per run (controller "mpc_level_loops").
# Copied from ndpr_plant_sized.toml; regenerate that one, then this, rather than hand-edit flows.
# Generated by notebooks/02_design_baselines.py from ndpr_sweep_base on 2026-10-13.
# Design step: minimize reagent subject to steady state, product purity >= 0.995,
# recovery >= 0.950, input bounds; organic flow capped at 85% of the 4700 L/h
# pump maximum so a controller has headroom (both chosen); organic loading in every stage at most
# 85% of its capacity (parameters.toml, chosen).
# Measured on the model at this point: purity 0.9950, recovery 0.9500, reagent 2172 mol/h.
# Regenerate rather than hand-edit the numbers.
name = "ndpr_main"
description = "The main case. The NdPr split on 8 extraction + 20 scrub + 4 strip stages, mixers sized for the flows (130 L), run with margin (aiming at 99.8 % purity and 97 % recovery against a 99 % spec), an acidity floor in the controller and a 120 h trim. Use it with the MPC over level loops. Every current result is on this one."

[circuit]
n_ext = 8
n_scrub = 20
n_strip = 4
organic_recycle = true
model = "fast"
cut = "LaCe"

[feed]
deposit = "eneabba"
total_RE_g_per_L = 50.0
acid = 0.05
removed_upstream = ["SmPlus"]

[flows]                         # L/h
organic = 1634.0
feed = 600.0
scrub = 218.1                  # reflux: strip product sent back as scrub liquor
strip = 518.1                  # = 300 net product + scrub reflux

[scrub]
acid = 2.0000
metal = "reflux"

[strip]
acid = 2.0

[saponification]
mode = "simple"
fraction = 0.4282

[targets]
purity = 0.99                   # spec
recovery = 0.970                # the controller's recovery target (with margin; the design's was 0.95)

[commissioning]
trim_hours = 120.0               # the stage-sized plant is ~3.5x slower; 30 h left some plants below spec

[plant]
mismatch = "perturbed"          # the plant differs from the model: src/mismatch.py, seed 1
seed = 1
strength = 1.0

[sim]
t_end = 60.0
dt_out = 0.25

# Parameter edits from params/edits_sized_stages.toml, applied on top of params/parameters.toml
# Parameter edits for the plant with stages sized to the design flows (notebooks/13_stage_sizing.py).
# The lab rig scaled 250 times gives a 30 L mixer, sized for 600 L/h in all at a three-minute
# residence time. The ndpr_plant design puts up to 2,594 L/h through an extraction mixer (600 feed
# + 239 scrub + 1,755 organic), so its stages reach only 81-85 % of equilibrium. These sizes give
# every stage at least the lab's three minutes at the design flows.

[parameter_edits.stage_geometry]
mixer_volume_L = 130.0      # derived: 2,594 L/h x 0.05 h = 130 L (the extraction mixer, the largest flow)
settler_volume_L = 520.0    # derived: 4 x the mixer, the lab rig's settler-to-mixer ratio (0.480 / 0.120)

[parameter_edits.targets]
design_purity_fraction = 0.998   # the controller's purity target, with margin (the design's was 0.995)

[controller_settings]
acid_floor = 1e-3                # mol/L on every extraction stage's aqueous acid (decision 33)
