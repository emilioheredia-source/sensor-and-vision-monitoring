# Generated by notebooks/02_design_baselines.py from ndpr_sweep_base on 2026-10-08.
# Design step: minimize reagent subject to steady state, product purity >= 0.995,
# recovery >= 0.950, input bounds; organic flow capped at 85% of the 4700 L/h
# pump maximum so a controller has headroom (both chosen); organic loading in every stage at most
# 85% of its capacity (parameters.toml, chosen).
# Measured on the model at this point: purity 0.9950, recovery 0.9500, reagent 2308 mol/h.
# Regenerate rather than hand-edit the numbers.
name = "ndpr_plant"
description = "The first plant, superseded. 8 + 20 + 4 stages with 30 L mixers, too small for the flows (stages reach 81-85 % of equilibrium), designed at the edge (99.5 % / 95 %). Kept because the earlier studies ran on it; use ndpr_main for anything new."

[circuit]
n_ext = 8
n_scrub = 20
n_strip = 4
organic_recycle = true
model = "fast"
cut = "LaCe"

[feed]
deposit = "eneabba"
total_RE_g_per_L = 50.0
acid = 0.05
removed_upstream = ["SmPlus"]

[flows]                         # L/h
organic = 1754.5
feed = 600.0
scrub = 239.0                  # reflux: strip product sent back as scrub liquor
strip = 539.0                  # = 300 net product + scrub reflux

[scrub]
acid = 2.0000
metal = "reflux"

[strip]
acid = 2.0

[saponification]
mode = "simple"
fraction = 0.4285

[targets]
purity = 0.99                   # spec; the design point sits at 0.995
recovery = 0.950

[plant]
mismatch = "perturbed"          # for the notebooks: the plant differs from the model (src/mismatch.py,
                                # seed 1). Runs through runs.py take the plant from RunSpec.plant.
seed = 1
strength = 1.0

[sim]
t_end = 60.0
dt_out = 0.25
