# Generated by notebooks/02_design_baselines.py from ndpr_sweep_base_yangibana on 2026-10-18.
# Design step: minimize reagent subject to steady state, product purity >= 0.995,
# recovery >= 0.950, input bounds; organic flow capped at 85% of the 4700 L/h
# pump maximum so a controller has headroom (both chosen); organic loading in every stage at most
# 85% of its capacity (parameters.toml, chosen).
# Measured on the model at this point: purity 0.9950, recovery 0.9500, reagent 1862 mol/h.
# Regenerate rather than hand-edit the numbers.
name = "ndpr_plant_sized_yangibana"
description = "The 8 + 20 + 4 sized plant designed on the Yangibana feed at the edge (99.5 % / 95 %), no margin: the design that ndpr_main_yangibana runs with margin."

[circuit]
n_ext = 8
n_scrub = 20
n_strip = 4
organic_recycle = true
model = "fast"
cut = "LaCe"

[feed]
deposit = "yangibana"
total_RE_g_per_L = 50.0
acid = 0.05
removed_upstream = ["SmPlus"]

[flows]                         # L/h
organic = 1620.6
feed = 600.0
scrub = 141.7                  # reflux: strip product sent back as scrub liquor
strip = 441.7                  # = 300 net product + scrub reflux

[scrub]
acid = 2.0000
metal = "reflux"

[strip]
acid = 2.0

[saponification]
mode = "simple"
fraction = 0.4287

[targets]
purity = 0.99                   # spec; the design point sits at 0.995
recovery = 0.950

[plant]
mismatch = "perturbed"          # the plant differs from the model: src/mismatch.py, seed 1
seed = 1
strength = 1.0

[sim]
t_end = 60.0
dt_out = 0.25

# Parameter edits from params/edits_sized_stages.toml, applied on top of params/parameters.toml
# Parameter edits for the plant with stages sized to the design flows (notebooks/13_stage_sizing.py).
# The lab rig scaled 250 times gives a 30 L mixer, sized for 600 L/h in all at a three-minute
# residence time. The ndpr_plant design puts up to 2,594 L/h through an extraction mixer (600 feed
# + 239 scrub + 1,755 organic), so its stages reach only 81-85 % of equilibrium. These sizes give
# every stage at least the lab's three minutes at the design flows.

[parameter_edits.stage_geometry]
mixer_volume_L = 130.0      # derived: 2,594 L/h x 0.05 h = 130 L (the extraction mixer, the largest flow)
settler_volume_L = 520.0    # derived: 4 x the mixer, the lab rig's settler-to-mixer ratio (0.480 / 0.120)
